name: Chequeo de salud

# Verifica que el sitio, la base y la Edge Function sigan en pie, y abre un
# issue si algo falla. De paso mantiene activo el proyecto de Supabase: el plan
# gratuito pausa los proyectos inactivos, y esto los toca cada pocos días.
on:
  schedule:
    - cron: "0 12 * * 1,4" # lunes y jueves al mediodía UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  chequear:
    name: Sitio, base y función
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Chequear
        id: chequeo
        env:
          URL_SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/health-check.js

      - name: Leer el informe
        if: always()
        id: informe
        run: |
          if [ -f informe-salud.txt ]; then
            {
              echo 'texto<<FIN'
              cat informe-salud.txt
              echo 'FIN'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'texto=El chequeo no llegó a generar informe.' >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir un issue si algo falló
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const marca = '<!-- chequeo-de-salud -->';
            const informe = `${{ steps.informe.outputs.texto }}`;
            const cuerpo = [
              marca,
              '## El chequeo automático encontró un problema',
              '',
              informe,
              '',
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Si la API de Supabase no responde, lo más probable es que el plan',
              'gratuito haya pausado el proyecto por inactividad: se reactiva a mano',
              'desde el panel de Supabase.',
              '',
              'Este issue se cierra solo cuando el siguiente chequeo pase.',
            ].join('\n');

            // Una sola conversación abierta: si ya hay un issue del chequeo, se
            // comenta ahí en vez de acumular issues repetidos.
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'salud',
            });
            const existente = abiertos.data.find((i) => i.body && i.body.includes(marca));

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Chequeo de salud fallido',
                body: cuerpo,
                labels: ['salud'],
              });
            }

      - name: Cerrar el issue si todo volvió a estar bien
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const marca = '<!-- chequeo-de-salud -->';
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'salud',
            });
            for (const issue of abiertos.data) {
              if (!issue.body || !issue.body.includes(marca)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'El chequeo volvió a pasar: todo en orden. Se cierra solo.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
