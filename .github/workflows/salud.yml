name: Chequeo de salud

# Verifica que el sitio, la base y la Edge Function sigan en pie, y abre un
# issue si algo falla. De paso mantiene activo el proyecto de Supabase: el plan
# gratuito pausa los proyectos inactivos, y esto los toca cada pocos días.
on:
  schedule:
    - cron: "0 12 * * 1,4" # lunes y jueves al mediodía UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  chequear:
    name: Sitio, base y función
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # continue-on-error: un chequeo en rojo no debe cortar el job, porque los
      # pasos que abren el issue vienen después. El resultado real se refleja
      # al final, en "Reflejar el resultado del chequeo".
      - name: Chequear
        id: chequeo
        continue-on-error: true
        env:
          URL_SITIO: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/health-check.js

      - name: Leer el informe
        if: always()
        id: informe
        run: |
          if [ -f informe-salud.txt ]; then
            texto="$(cat informe-salud.txt)"
          else
            texto="El chequeo no llegó a generar informe; hay que mirar el log de la corrida."
          fi

          # El delimitador se arma al vuelo para que no pueda aparecer dentro
          # del informe, y printf garantiza que quede solo en su línea: $(...)
          # ya comió los saltos finales, tenga o no el archivo salto propio.
          # Con un "cat" pelado, un archivo sin salto final pega el
          # delimitador a la última línea y Actions rechaza el bloque entero.
          delim="FIN_$(date +%s%N)_${RANDOM}"
          printf 'texto<<%s\n%s\n%s\n' "$delim" "$texto" "$delim" >> "$GITHUB_OUTPUT"

      # Se abre issue tanto si los chequeos encontraron algo como si el propio
      # workflow se rompió: un job en rojo sin aviso es justo lo que hay que
      # evitar. failure() acá solo puede venir de otro paso, porque el chequeo
      # tiene continue-on-error.
      - name: Abrir un issue si algo falló
        if: always() && (steps.chequeo.outcome == 'failure' || failure())
        uses: actions/github-script@v9
        env:
          # Por env y no interpolado en el script: el informe lleva mensajes de
          # error de servicios externos, y pegarlo dentro de un template
          # literal deja que un backtick o un ${...} rompan o ejecuten código.
          INFORME: ${{ steps.informe.outputs.texto }}
          CHEQUEO: ${{ steps.chequeo.outcome }}
        with:
          script: |
            const marca = '<!-- chequeo-de-salud -->';
            const informe = process.env.INFORME || '(sin informe)';
            const fallaronLosChequeos = process.env.CHEQUEO === 'failure';
            const cuerpo = [
              marca,
              fallaronLosChequeos
                ? '## El chequeo automático encontró un problema'
                : '## El chequeo no pudo completarse',
              '',
              fallaronLosChequeos
                ? ''
                : 'Falló un paso del propio workflow, no un chequeo. El informe' +
                  ' de abajo puede estar incompleto o ser de antes del corte.',
              '',
              informe,
              '',
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Si la API de Supabase no responde, lo más probable es que el plan',
              'gratuito haya pausado el proyecto por inactividad: se reactiva a mano',
              'desde el panel de Supabase.',
              '',
              'Este issue se cierra solo cuando el siguiente chequeo pase.',
            ].join('\n');

            // Una sola conversación abierta: si ya hay un issue del chequeo, se
            // comenta ahí en vez de acumular issues repetidos.
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'salud',
            });
            const existente = abiertos.data.find((i) => i.body && i.body.includes(marca));

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Chequeo de salud fallido',
                body: cuerpo,
                labels: ['salud'],
              });
            }

      # Sólo se cierra si los chequeos pasaron Y nada más se rompió: cerrar un
      # issue mientras el workflow está roto sería tapar el problema.
      - name: Cerrar el issue si todo volvió a estar bien
        if: success() && steps.chequeo.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const marca = '<!-- chequeo-de-salud -->';
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'salud',
            });
            for (const issue of abiertos.data) {
              if (!issue.body || !issue.body.includes(marca)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'El chequeo volvió a pasar: todo en orden. Se cierra solo.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      # Va último a propósito: el chequeo lleva continue-on-error, así que sin
      # esto un chequeo en rojo dejaría el job en verde.
      - name: Reflejar el resultado del chequeo
        if: always() && steps.chequeo.outcome == 'failure'
        run: |
          echo "::error::El chequeo de salud falló; ver el informe en el issue con etiqueta 'salud'."
          exit 1
