name: Respaldo de la base

# El plan gratuito de Supabase pausa los proyectos inactivos y no garantiza
# backups. Esto guarda un volcado semanal en el propio repositorio.
#
# El repo es público y el volcado trae correos, hashes de contraseñas, sesiones
# y la bitácora completa, así que NUNCA se commitea en claro: se cifra con
# `gpg --symmetric` usando el secreto RESPALDO_CLAVE. Para restaurar:
#   gpg -d respaldos/datos.sql.gpg > datos.sql
#
# Si faltan los secretos, el job se salta en vez de fallar.
on:
  schedule:
    - cron: "0 6 * * 1" # lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  respaldar:
    name: Volcado semanal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ¿Están los secretos?
        id: secretos
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$REF" ] && [ -n "$PASS" ] && [ -n "$CLAVE" ]; then
            echo "listos=si" >> "$GITHUB_OUTPUT"
          else
            echo "listos=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan secretos de Supabase o RESPALDO_CLAVE; no se hace respaldo."
          fi

      - name: Instalar la CLI de Supabase
        if: steps.secretos.outputs.listos == 'si'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Enlazar el proyecto
        if: steps.secretos.outputs.listos == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Volcar los datos
        if: steps.secretos.outputs.listos == 'si'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Con reintentos: el pooler de Supabase a veces responde un rato con
        # "EAUTHQUERY ... connection to database not available" (la base se
        # está reiniciando o despertando), y sin esto se pierde el respaldo de
        # toda la semana por un corte de segundos. Se vuelca a un temporal y
        # se mueve al final, así un intento a medias no pisa el respaldo bueno.
        run: |
          mkdir -p "$RUNNER_TEMP/volcado"
          volcar() {
            destino="$1"; shift
            for intento in 1 2 3 4 5; do
              if supabase db dump "$@" -f "$destino.tmp"; then
                mv "$destino.tmp" "$destino"
                return 0
              fi
              rm -f "$destino.tmp"
              [ "$intento" -lt 5 ] || break
              espera=$((intento * 30))
              echo "::warning::Falló el volcado de $destino (intento $intento/5); reintento en ${espera}s."
              sleep "$espera"
            done
            echo "::error::No se pudo volcar $destino tras 5 intentos."
            return 1
          }
          # Los volcados en claro quedan fuera del checkout, en $RUNNER_TEMP.
          volcar "$RUNNER_TEMP/volcado/datos.sql" --data-only
          volcar "$RUNNER_TEMP/volcado/esquema.sql"

      - name: Cifrar
        if: steps.secretos.outputs.listos == 'si'
        env:
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        # gpg produce un archivo distinto en cada corrida aunque los datos no
        # cambien, así que se guarda el sha256 del texto en claro y solo se
        # recifra si ese hash cambió (evita un commit inútil por semana).
        run: |
          mkdir -p respaldos
          cd "$RUNNER_TEMP/volcado"
          sha256sum datos.sql esquema.sql > sumas.txt
          if cmp -s sumas.txt "$GITHUB_WORKSPACE/respaldos/sumas.txt"; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          for f in datos.sql esquema.sql; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              -o "$GITHUB_WORKSPACE/respaldos/$f.gpg" "$f" <<< "$RESPALDO_CLAVE"
          done
          cp sumas.txt "$GITHUB_WORKSPACE/respaldos/sumas.txt"
          rm -f datos.sql esquema.sql

      - name: Commitear si cambió algo
        if: steps.secretos.outputs.listos == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add respaldos/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos; no se commitea."
          else
            git commit -m "Respaldo automático de la base ($(date -u +%Y-%m-%d))"
            git push
          fi
